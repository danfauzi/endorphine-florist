<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Endorphine Florist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,_#fce7f3,_transparent_42%),radial-gradient(circle_at_bottom_right,_#fbcfe8,_transparent_38%),#fff7fb] flex items-center justify-center p-4 selection:bg-pink-500 selection:text-white">

    <!-- Card Container -->
    <div class="relative w-full max-w-md overflow-hidden rounded-[2rem] border border-white/80 bg-white/85 p-7 shadow-[0_24px_70px_rgba(190,24,93,0.16)] backdrop-blur-xl sm:p-9">
        
        <!-- Hiasan Background Circles -->
        <div class="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full bg-pink-300/30 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-16 -left-16 h-40 w-40 rounded-full bg-rose-300/30 blur-3xl"></div>

        <!-- Header / Logo -->
        <div class="relative z-10 mb-8 text-center">
            <a href="http://127.0.0.1:8010" class="group mb-3 inline-flex items-center gap-2">
                <span class="text-4xl transition duration-300 group-hover:scale-110">🌸</span>
                <span class="text-2xl font-black tracking-tight text-pink-600">
                    Endorphine<span class="text-slate-800">Florist</span>
                </span>
            </a>
            <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-gradient-to-r from-pink-400 to-rose-500"></div>
            <h2 class="mt-2 text-2xl font-extrabold tracking-tight text-slate-800">Selamat Datang</h2>
            <p class="mt-2 text-xs font-medium text-slate-400">Masuk untuk melanjutkan pesananmu</p>
        </div>

        <!-- Session Status / Validation Errors -->
        
        
        <!-- Form Login -->
        <form method="POST" action="http://127.0.0.1:8010/login" class="relative z-10 space-y-5">
            <input type="hidden" name="_token" value="XJsTXXdY3IB5y3iHiP7jlny1uGkmxEEE9veUDWta" autocomplete="off">
            <!-- Email Address -->
            <div>
                <label for="email" class="mb-2 block text-xs font-extrabold uppercase tracking-[0.14em] text-slate-600">Alamat Email</label>
                <div class="relative">
                    <input id="email" type="email" name="email" value="" required autofocus autocomplete="email" placeholder="nama@email.com"
                        class="w-full rounded-2xl border border-slate-200/90 bg-slate-50/70 px-4 py-3.5 text-sm font-semibold text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-pink-400 focus:bg-white focus:ring-4 focus:ring-pink-100">
                </div>
            </div>

            <!-- Password -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-xs font-extrabold uppercase tracking-[0.14em] text-slate-600">Kata Sandi</label>
                                            <a href="http://127.0.0.1:8010/forgot-password" class="text-[11px] font-bold text-pink-600 transition hover:text-pink-700">
                            Lupa sandi?
                        </a>
                                    </div>
                <div class="relative">
                    <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Masukkan kata sandi"
                        class="w-full rounded-2xl border border-slate-200/90 bg-slate-50/70 px-4 py-3.5 pr-12 text-sm font-semibold text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-pink-400 focus:bg-white focus:ring-4 focus:ring-pink-100">
                    <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 transition hover:bg-pink-50 hover:text-pink-500" aria-label="Tampilkan kata sandi" aria-pressed="false">
                        <svg id="eye-closed" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                            <circle cx="12" cy="12" r="2.5"></circle>
                        </svg>
                        <svg id="eye-open" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a18 18 0 0 1-3.1 3.7M6.1 6.1C3.8 7.7 2.5 12 2.5 12s3.5 6 9.5 6c1 0 2-.2 2.9-.5"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Remember Me -->
            <div class="flex items-center justify-between pt-0.5">
                <label class="flex cursor-pointer items-center gap-2.5">
                    <input type="checkbox" name="remember" value="1"  class="h-4 w-4 cursor-pointer rounded border-slate-300 text-pink-600 focus:ring-pink-500">
                    <span class="text-xs font-semibold text-slate-600">Ingat Saya</span>
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="mt-1 w-full rounded-2xl bg-gradient-to-r from-pink-500 via-rose-500 to-fuchsia-500 py-3.5 text-sm font-extrabold text-white shadow-[0_14px_26px_rgba(236,72,153,0.28)] ring-1 ring-pink-300/60 transition duration-200 hover:-translate-y-0.5 hover:shadow-[0_18px_30px_rgba(236,72,153,0.38)]">
                Masuk Sekarang
            </button>
        </form>

        <!-- Footer Link (Registrasi & Kembali) -->
        <div class="relative z-10 mt-8 flex flex-col gap-4 border-t border-slate-100 pt-5 text-center">
            <p class="text-xs text-slate-500">
                Belum punya akun? 
                <a href="http://127.0.0.1:8010/register" class="font-bold text-pink-600 hover:text-pink-700 transition">
                    Daftar Akun Baru
                </a>
            </p>
        </div>

        <!-- Footer Link (Kembali) -->
        <div class="relative z-10 mt-5 border-t border-slate-100 pt-5 text-center">
            <a href="http://127.0.0.1:8010" class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white/80 px-4 py-2.5 text-xs font-bold text-slate-500 shadow-sm transition hover:-translate-y-0.5 hover:border-pink-200 hover:bg-pink-50 hover:text-pink-600">
                Kembali ke Katalog Utama
            </a>
        </div>

    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');
        const eyeClosed = document.getElementById('eye-closed');
        const eyeOpen = document.getElementById('eye-open');

        togglePassword.addEventListener('click', () => {
            const isPasswordVisible = passwordInput.type === 'text';

            passwordInput.type = isPasswordVisible ? 'password' : 'text';
            togglePassword.setAttribute('aria-pressed', String(!isPasswordVisible));
            togglePassword.setAttribute('aria-label', isPasswordVisible ? 'Tampilkan kata sandi' : 'Sembunyikan kata sandi');
            eyeClosed.classList.toggle('hidden', !isPasswordVisible);
            eyeOpen.classList.toggle('hidden', isPasswordVisible);
        });
    </script>

</body>
</html>
